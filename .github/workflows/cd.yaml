name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no Render
    # Só implanta se: a CI concluiu com sucesso, foi disparada por push
    # (nunca por Pull Request) e o commit está na branch main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Acionar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Segredo RENDER_DEPLOY_HOOK_URL não configurado." >&2
            exit 1
          fi
          # -s: sem barra de progresso; -S: mostra erro; -f: falha em HTTP >= 400.
          # A URL nunca é impressa e o GitHub mascara o segredo nos logs.
          curl -sSf -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy solicitado ao Render com sucesso."