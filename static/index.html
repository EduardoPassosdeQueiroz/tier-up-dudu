<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tier Du</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --text: #f0f0f5;
    --muted: #8b8fa3;
    --tier-s: #e53935;
    --tier-a: #fb8c00;
    --tier-b: #fdd835;
    --tier-c: #43a047;
    --tier-e: #1e88e5;
 --tier-f: #8e44ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .screen { display: none; padding: 20px; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== TELA DE ENTRADA ===== */
  #entry { justify-content: center; align-items: center; text-align: center; }
  #entry h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-e), var(--tier-f));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 32px;
  }
  input {
    width: 100%;
    max-width: 360px;
    padding: 16px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    margin-bottom: 12px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: var(--tier-a); }
  .btn {
    padding: 16px 32px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    width: 100%;
    max-width: 360px;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    color: white;
    box-shadow: 0 4px 16px rgba(229,57,53,0.3);
  }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.1);
  }
  #btnJoin {
    box-shadow: 0 4px 22px rgba(229,57,53,0.45), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .or-divider {
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ===== LOBBY ===== */
  #lobby { align-items: center; }
  .room-code-box {
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a));
    padding: 20px 40px;
    border-radius: 16px;
    margin-bottom: 24px;
    text-align: center;
  }
  .room-code-box small { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: .9; }
  .room-code-box .code { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; letter-spacing: 8px; }
  .players-list {
    width: 100%;
    max-width: 400px;
    margin-bottom: 24px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  .player-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px;
  }
  .player-name { font-weight: 600; flex: 1; }
  .player-host { font-size: 11px; color: var(--tier-a); text-transform: uppercase; letter-spacing: 1px; }
  .btn-start { width: 100%; max-width: 400px; margin-top: 16px; }
  .btn-start:disabled { opacity: .4; cursor: not-allowed; }
  .copy-link { color: var(--tier-a); font-size: 13px; margin-top: 12px; text-decoration: underline; cursor: pointer; }

  /* ===== GAME: ANSERING ===== */
  .theme-label {
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .theme-title {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 900;
    margin-bottom: 32px;
    line-height: 1.1;
  }
  .my-tier {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 16px;
    font-size: 3rem;
    font-weight: 900;
    color: white;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .timer {
    font-size: 4rem;
    font-weight: 900;
    text-align: center;
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }
  textarea {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  textarea:focus { border-color: var(--tier-a); }

  /* ===== GAME: DISCUSSION BOARD ===== */
  .tier-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 8px;
    margin-bottom: 8px;
    padding: 12px;
    border-radius: 12px;
    min-height: 80px;
  }
  .tier-row.s { background: rgba(229,57,53,.15); border-left: 4px solid var(--tier-s); }
  .tier-row.a { background: rgba(251,140,0,.15); border-left: 4px solid var(--tier-a); }
  .tier-row.b { background: rgba(253,216,53,.15); border-left: 4px solid var(--tier-b); }
  .tier-row.c { background: rgba(67,160,71,.15); border-left: 4px solid var(--tier-c); }
  .tier-row.f { background: rgba(30,136,229,.15); border-left: 4px solid var(--tier-f); }
  .tier-label {
    font-size: 2rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tier-label.s { color: var(--tier-s); }
  .tier-label.a { color: var(--tier-a); }
  .tier-label.b { color: var(--tier-b); }
  .tier-label.c { color: var(--tier-c); }
  .tier-label.f { color: var(--tier-f); }
  .answer-card {
    background: var(--card);
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.05);
    word-break: break-word;
  }
  .answer-card strong { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  /* ===== JUIZ / PODER ===== */
  .tier-options {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .tier-btn {
    padding: 20px 8px;
    border-radius: 12px;
    border: none;
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
    cursor: pointer;
    transition: transform .15s;
  }
  .tier-btn:active { transform: scale(.92); }
  .tier-btn.s { background: var(--tier-s); }
  .tier-btn.a { background: var(--tier-a); }
  .tier-btn.b { background: var(--tier-b); }
  .tier-btn.c { background: var(--tier-c); }
  .tier-btn.f { background: var(--tier-f); }
  .power-options {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 16px 0;
  }
  .power-btn {
    padding: 16px 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
  }
  .power-btn:disabled { opacity: .3; cursor: not-allowed; }
  .power-btn.up { border-color: var(--tier-c); }
  .power-btn.down { border-color: var(--tier-s); }

  .role-notice {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    padding: 16px 20px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }
  .discussing-notice {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    color: var(--muted);
    border: 2px solid rgba(255,255,255,0.05);
  }

  /* ===== REVIEW ===== */
  .review-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .tier-badge {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: white; font-size: 1.2rem;
  }
  .score-box {
    text-align: center;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    margin: 16px 0;
  }
  .score-box .num { font-size: 3rem; font-weight: 900; }
  .score-box .num.positive { color: var(--tier-c); }
  .score-box .num.negative { color: var(--tier-s); }

  /* ===== FINAL ===== */
  .final-score {
    display: grid;
    gap: 12px;
    margin: 16px 0;
  }
  .final-row {
    padding: 16px;
    background: var(--card);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .final-row.best { border: 2px solid var(--tier-c); }

  /* ===== RESPONSIVO ===== */
  @media (min-width: 768px) {
    .screen { padding: 40px; }
    .theme-title { font-size: 3rem; }
  }

  #gameContent { width:100%; max-width:1000px; margin:auto; }
  .entry-options { display:grid; grid-template-columns:1fr 1fr; gap:32px; width:100%; max-width:780px; margin:52px 0 28px; }
  .entry-options section { padding:24px; border:1px solid #ffffff20; border-radius:16px; background:var(--card); }
  .entry-options p { min-height:48px; margin-bottom:20px; line-height:1.5; }
  .palette { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .swatch { width:32px; height:32px; border:2px solid #ffffff50; border-radius:50%; cursor:pointer; }
  .swatch[aria-pressed="true"] { outline:3px solid white; outline-offset:3px; }
  .help { color:var(--text); line-height:1.6; background:var(--card); border:1px solid #ffffff20; padding:18px; border-radius:12px; margin:16px 0; }
  .people { color:var(--muted); line-height:1.8; margin:12px 0; }
  .people strong { color:var(--text); }
  .board-image { position:relative; max-width:700px; margin:20px auto; }
  .board-image img:not([hidden]) { display:block; width:100%; border-radius:16px; }
  .board-theme { background:#382013; border:2px solid #e8bb65; color:#fff3cd; border-radius:8px; padding:10px 18px; text-align:center; font-weight:800; overflow-wrap:anywhere; }
  .tier-row.e { background:#1e88e526; border-left:4px solid var(--tier-e); }
  .tier-row.f { background:#8e44ad26; }
  .tier-label.e { color:var(--tier-e); }
  .tier-btn.e { background:var(--tier-e); }
  .tier-label.b,.tier-btn.b { color:#29220a; }
  .tier-row > div:last-child { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .grade { text-align:center; font-size:12px; display:grid; justify-items:center; gap:6px; }
  .tier-badge { width:52px; height:52px; }
  .review-row { grid-template-columns:1fr auto auto auto; }
  .kick { background:transparent; border:1px solid var(--tier-s); color:var(--text); padding:8px; border-radius:8px; cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  @media(max-width:540px) { .entry-options { gap:12px; } .entry-options section { padding:14px 8px; } .entry-options .btn { padding:14px 8px; } .review-row { gap:8px; } .tier-row { grid-template-columns:44px 1fr; } .grade { font-size:10px; } }
</style>
</head>
<body>

<!-- TELA 1: ENTRADA -->
<div id="entry" class="screen active">
  <h1>TIER DU</h1>
  <input id="inputName" type="text" placeholder="Seu nome" maxlength="20" />
  <div class="entry-options">
    <section><p>Crie uma nova partida com os amigos</p><button class="btn btn-primary" id="btnCreate">Criar sala</button></section>
    <section><p>Entre em uma sala existente</p><input id="inputCode" aria-label="Código da sala" placeholder="Código" maxlength="4" style="text-transform:uppercase"><button class="btn btn-primary" id="btnJoin">Entrar</button></section>
  </div>
  <p>Escolha a cor do jogo</p><div class="palette" id="palette"></div>
</div>

<!-- TELA 2: LOBBY -->
<div id="lobby" class="screen">
  <div class="room-code-box">
    <small>Código da sala</small>
    <div class="code" id="displayCode">----</div>
  </div>
  <div class="players-list" id="playersList"></div>
  <button class="btn btn-primary btn-start" id="btnStart" disabled>Iniciar partida (3+ jogadores)</button>
  <div class="copy-link" id="copyLink">Copiar link da sala</div>
</div>

<!-- TELA 3: GAME -->
<div id="game" class="screen">
  <div id="gameContent"></div>
</div>

<script>
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
const TIERS=['S','A','B','C','E','F'];
const LABELS={S:'Lendários',A:'Excelentes',B:'Consistentes',C:'Aceitáveis',E:'Ruim',F:'Desastrosos'};
let ws, myState={}, timerInterval, draftKey='', draft='';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(type,data) { if(ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type,data})); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); }
function connect(name,code) {
 if(ws && [WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState)) return;
 ws=new WebSocket(WS_URL);
 ws.onopen=()=>send('join',{name,code});
 ws.onmessage=ev=>{
  const d=JSON.parse(ev.data);
  if(d.type==='joined') { myState={code:d.code,host:d.host,name}; document.getElementById('displayCode').textContent=d.code; showScreen('lobby'); return; }
  if(d.error) { const errors={sala_nao_encontrada:'Sala não encontrada.',nome_invalido:'Use um nome de até 20 caracteres.',partida_em_andamento:'Esta partida já começou.',removido:'O host removeu você da sala.'}; alert(errors[d.error]||d.error); ws.close(); return; }
  renderState(d);
 };
 ws.onclose=()=>{ clearInterval(timerInterval); showScreen('entry'); myState={}; };
 ws.onerror=()=>alert('Não foi possível conectar à sala. Tente novamente.');
}
document.getElementById('btnCreate').onclick=()=>{const n=document.getElementById('inputName').value.trim(); if(n) connect(n,''); else alert('Digite seu nome');};
document.getElementById('btnJoin').onclick=()=>{const n=document.getElementById('inputName').value.trim(),c=document.getElementById('inputCode').value.trim().toUpperCase(); if(n&&c) connect(n,c); else alert('Digite seu nome e o código da sala');};
document.getElementById('btnStart').onclick=()=>send('start');
document.getElementById('copyLink').onclick=async()=>{try {await navigator.clipboard.writeText(`${location.origin}/?code=${myState.code}`); alert('Link copiado!');} catch {alert(`Código da sala: ${myState.code}`);} };
const palettes={Preto:['#0f1117','#1a1d28'],Vermelho:['#260f14','#401b24'],Amarelo:['#292308','#413916'],Azul:['#0c192e','#162b46'],Roxo:['#21112e','#352042'],Rosa:['#2e1125','#452039'],Verde:['#0d2419','#1b382b'],Laranja:['#2d190c','#442b1a']};
const swatches=['#111111','#e53935','#fdd835','#1e88e5','#8e44ad','#ec4899','#43a047','#fb8c00'];
function setPalette(name) {if(!palettes[name]) name='Preto'; const [bg,card]=palettes[name]; document.documentElement.style.setProperty('--bg',bg); document.documentElement.style.setProperty('--card',card); document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.title===name))); try {localStorage.setItem('tier-du-color',name);} catch {} }
document.getElementById('palette').innerHTML=Object.keys(palettes).map((n,i)=>`<button class="swatch" title="${n}" aria-label="${n}" style="background:${swatches[i]}" onclick="setPalette('${n}')"></button>`).join('');
let saved='Preto'; try {saved=localStorage.getItem('tier-du-color')||saved;} catch {} setPalette(saved);
function renderState(d) {
 const input=document.getElementById('answerText');
 const sameDraft=d.phase==='answering' && draftKey===`${d.code}:${d.round}:${d.revision}`;
 const focused=sameDraft && document.activeElement===input && !!input;
 const selection=input?[input.selectionStart,input.selectionEnd]:null;
 if(input && myState.phase==='answering') draft=input.value;
 myState={...myState,...d}; clearInterval(timerInterval);
 renderLobby(d.players||[],d.canStart);
 if(d.phase==='lobby') {showScreen('lobby'); return;}
 showScreen('game');
 ({answering:renderAnswering,discussing:renderDiscussing,power:renderPower,changes:renderChanges,review:renderReview,final:renderFinal}[d.phase]||(()=>{}))(d);
 if(focused) {const next=document.getElementById('answerText'); if(next) {next.focus(); next.setSelectionRange(...selection);} }
}
function renderLobby(players,canStart) {
 document.getElementById('playersList').innerHTML=players.map(p=>`<div class="player-row"><div class="player-avatar">${esc(p.name.charAt(0).toUpperCase())}</div><div class="player-name">${esc(p.name)}${p.connected===false?' (desconectado)':''}</div>${p.host?'<div class="player-host">Host</div>':myState.host&&myState.phase==='lobby'?`<button class="kick" onclick="send('kick',{playerID:'${p.id}'})">Remover</button>`:''}</div>`).join('');
 document.getElementById('btnStart').disabled=!canStart;
 document.getElementById('btnStart').textContent=myState.host?'Iniciar partida (3+ jogadores)':'Aguardando o host iniciar';
}
function heading(d) {return `<div class="theme-label">Rodada ${d.round} de 5 · Tema da vez</div><div class="theme-title">${esc(d.currentTheme)}</div>`;}
function people(d) {return `<div class="people">Resposta de <strong>${esc(d.discussingPlayerName)}</strong><br>Líder: <strong>${esc(d.judgeName)}</strong> (registra o ranking decidido pelo grupo)</div>`;}
function badge(t) {return `<div class="tier-badge" role="img" aria-label="Nota ${esc(t)}" style="background:var(--tier-${String(t).toLowerCase()});${t==='B'?'color:#29220a':''}">${esc(t)}</div>`;}
function board(d) {return TIERS.map(t=>`<div class="tier-row ${t.toLowerCase()}"><div class="tier-label ${t.toLowerCase()}">${t}</div><div>${(d.board||[]).filter(a=>a.placed===t).map(a=>`<div class="answer-card"><strong>${esc(a.playerName)}</strong>${esc(a.text)}</div>`).join('')}</div></div>`).join('');}
function renderAnswering(d) {
 const key=`${d.code}:${d.round}:${d.revision}`;
 if(key!==draftKey) {draftKey=key; draft='';}
 document.getElementById('gameContent').innerHTML=`${heading(d)}
 <div class="help">Você recebeu uma letra secreta. Escreva algo do tema que combine com esse nível: S é o mais alto e F é o mais baixo. Depois, o grupo tentará descobrir a posição da sua resposta. Não revele sua letra!</div>
 <div class="board-image"><img hidden src="/static/board.png" alt="Tabuleiro Tier Du" onload="this.hidden=false;this.nextElementSibling.hidden=true" onerror="this.remove()"><div class="board-fallback">${TIERS.map(t=>`<div class="tier-row ${t.toLowerCase()}"><div class="tier-label ${t.toLowerCase()}">${t}</div><div>${LABELS[t]}</div></div>`).join('')}</div><div class="board-theme">Tema da vez: ${esc(d.currentTheme)}</div></div>
 <div style="text-align:center">Sua letra secreta:<br><div class="my-tier" style="background:var(--tier-${d.myTier.toLowerCase()})">${d.myTier}</div><div>${LABELS[d.myTier]}</div></div>
 <div class="people">Autor: <strong>${esc(myState.name)}</strong><br>Líder da sua resposta: <strong>${esc(d.myLeaderName)}</strong> (registra o ranking decidido pelo grupo)</div>
 <div class="timer" id="timer"></div>
 ${d.iAnswered?'<div class="help">Resposta enviada! Aguarde os outros jogadores.</div>':'<textarea id="answerText" aria-label="Sua resposta" placeholder="Escreva sua resposta..." maxlength="100"></textarea><button class="btn btn-primary" id="btnAnswer">Confirmar resposta</button>'}
 <div class="help">${d.host?'Como host, você pode trocar o tema imediatamente.':'Mais da metade dos jogadores precisa votar para trocar o tema.'} A troca reinicia os 80 segundos e limpa as respostas para o novo tema.</div>
 <button class="btn btn-secondary" onclick="send('changeTheme')" ${!d.host&&d.iVotedTheme?'disabled':''}>${d.host?'Trocar tema agora':d.iVotedTheme?'Voto registrado':'Votar para trocar tema'}</button><p class="people">${d.themeVotes} de ${d.themeVotesNeeded} votos necessários</p>`;
 if(!d.iAnswered) {const input=document.getElementById('answerText'); input.value=draft; input.oninput=()=>{draft=input.value;}; document.getElementById('btnAnswer').onclick=()=>{const text=input.value.trim(); if(text) send('answer',{text}); else alert('Escreva uma resposta');};}
 startTimer(d.timerEnd);
}
function renderDiscussing(d) {
 const role=d.iAmTarget?'Sua resposta está sendo discutida. Ouça a conversa e não revele sua letra original.':d.iAmJudge?'Você é o líder desta resposta. Ouça todos e selecione abaixo a nota que o grupo fechou em consenso.':'Discuta com o grupo em qual ranking esta resposta se encaixa. O líder registrará a decisão de vocês.';
 document.getElementById('gameContent').innerHTML=`${heading(d)}${people(d)}<div class="answer-card">${esc(d.discussingText)}</div><div class="help">${role} Conversem antes de confirmar: a escolha abre a etapa dos poderes.</div>${board(d)}${d.iAmJudge?`<div class="tier-options">${TIERS.map(t=>`<button class="tier-btn ${t.toLowerCase()}" onclick="send('judge',{tier:'${t}'})">${t}</button>`).join('')}</div>`:'<div class="discussing-notice">Aguardando o líder registrar o consenso.</div>'}`;
}
function renderPower(d) {
 const disabled=d.myUsedPower||d.iAmTarget||d.myPowerChosen;
 document.getElementById('gameContent').innerHTML=`${heading(d)}${people(d)}<div class="answer-card">${esc(d.discussingText)}</div><div class="grade">Nota escolhida${badge(d.placed)}</div>
 <div class="help">Agora você pode subir ou descer esta resposta em uma posição. Cada jogador tem um poder por tema, e não pode usá-lo na própria resposta. Os poderes são somados: uma subida anula uma descida, inclusive em S e F. A nota nunca ultrapassa esses limites. Você também pode guardar o poder para outra resposta deste tema.</div>
 <div class="discussing-notice">${d.iAmTarget?'Você é o autor e não pode usar poder nesta resposta.':d.myPowerChosen?'Decisão registrada. Aguarde os demais.':d.myUsedPower?'Você já usou seu poder neste tema. Confirme para continuar.':'Escolha seu poder ou passe a vez.'}</div>
 <div class="timer" id="timer"></div><div class="power-options"><button class="power-btn up" ${disabled?'disabled':''} onclick="send('power',{choice:1})">↑ Subir 1 tier</button><button class="power-btn" ${d.iAmTarget||d.myPowerChosen?'disabled':''} onclick="send('power',{choice:0})">Não fazer nada</button><button class="power-btn down" ${disabled?'disabled':''} onclick="send('power',{choice:-1})">↓ Descer 1 tier</button></div>${board(d)}`;
 startTimer(d.timerEnd);
}
function renderChanges(d) {
 const change=d.changes[0];
 document.getElementById('gameContent').innerHTML=`${heading(d)}<h2>O que os poderes mudaram</h2>${people(d)}<div class="answer-card">${esc(d.discussingText)}</div><div class="help">${d.changes.map(c=>`<p><strong>${esc(c.playerName)}</strong>: ${c.choice===1?'↑ pediu para subir 1 tier':'↓ pediu para descer 1 tier'}</p>`).join('')}</div><div class="review-row"><div>Resultado dos poderes${change.before===change.after?'<p>A nota permaneceu igual: poderes opostos se anulam e os limites são S e F.</p>':''}</div><div class="grade">Antes${badge(change.before)}</div><div class="grade">Depois${badge(change.after)}</div></div><div class="timer" id="timer"></div>${d.host?'<button class="btn btn-primary" onclick="send(\'continue\')">Continuar</button>':'<p>A próxima etapa começa automaticamente.</p>'}`;
 startTimer(d.timerEnd);
}
function resultRows(r) {return r.answers.map(a=>{const diff=Math.abs(TIERS.indexOf(a.original)-TIERS.indexOf(a.placed)),pts=diff===0?3:diff===1?1:-1; return `<div class="review-row"><div><strong>${esc(a.playerName)}</strong><br><span style="color:var(--muted)">${esc(a.text)}</span>${a.leaderName?`<br><small>Líder: ${esc(a.leaderName)} (registra o consenso)</small>`:''}</div><div class="grade">Nota escolhida${badge(a.placed)}</div><div class="grade">Nota original${badge(a.original)}</div><strong>${pts>0?'+':''}${pts}</strong></div>`;}).join('');}
function renderReview(d) {const r=d.review; document.getElementById('gameContent').innerHTML=`${heading(d)}<div class="score-box"><div>Pontuação do grupo</div><div class="num ${r.score>=0?'positive':'negative'}">${r.score>0?'+':''}${r.score}</div></div>${resultRows(r)}${d.host?`<button class="btn btn-primary" onclick="send('nextRound')">${d.nextRound?'Próximo tema →':'Ver resultado final'}</button>`:'<p class="help">Aguardando o host continuar.</p>'}`;}
function renderFinal(d) {const total=d.results.reduce((s,r)=>s+r.score,0),best=Math.max(...d.results.map(r=>r.score)); document.getElementById('gameContent').innerHTML=`<div style="text-align:center"><div class="theme-label">RESULTADO FINAL · TIER DU</div><h1 class="timer">${total>0?'+':''}${total}</h1></div><div class="final-score">${d.results.map((r,i)=>`<div class="final-row ${r.score===best?'best':''}"><div><strong>Rodada ${i+1}</strong><br>${esc(r.theme)}</div><strong>${r.score}</strong></div>${resultRows(r)}`).join('')}</div><button class="btn btn-secondary" onclick="location.reload()">Jogar de novo</button>`;}
function startTimer(end) {clearInterval(timerInterval); const tick=()=>{const el=document.getElementById('timer'); if(el) el.textContent=`${Math.max(0,Math.ceil((end-Date.now())/1000))}s`;}; tick(); timerInterval=setInterval(tick,250);}
const code=new URLSearchParams(location.search).get('code'); if(code) document.getElementById('inputCode').value=code;

</script>
</body>
</html>
