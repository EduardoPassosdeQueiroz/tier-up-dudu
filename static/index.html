<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tier Du</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --text: #f0f0f5;
    --muted: #8b8fa3;
    --tier-s: #e53935;
    --tier-a: #fb8c00;
    --tier-b: #fdd835;
    --tier-c: #43a047;
    --tier-e: #1e88e5;
 --tier-f: #8e44ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .screen { display: none; padding: 20px; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== TELA DE ENTRADA ===== */
  #entry { justify-content: center; align-items: center; text-align: center; }
  #entry h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-e), var(--tier-f));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 32px;
  }
  input {
    width: 100%;
    max-width: 360px;
    padding: 16px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    margin-bottom: 12px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: var(--tier-a); }
  .btn {
    padding: 16px 32px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    width: 100%;
    max-width: 360px;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    color: white;
    box-shadow: 0 4px 16px rgba(229,57,53,0.3);
  }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.1);
  }
  #btnJoin {
    box-shadow: 0 4px 22px rgba(229,57,53,0.45), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .or-divider {
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ===== LOBBY ===== */
  #lobby { align-items: center; }
  .room-code-box {
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a));
    padding: 20px 40px;
    border-radius: 16px;
    margin-bottom: 24px;
    text-align: center;
  }
  .room-code-box small { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: .9; }
  .room-code-box .code { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; letter-spacing: 8px; }
  .players-list {
    width: 100%;
    max-width: 400px;
    margin-bottom: 24px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  .player-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px;
  }
  .player-name { font-weight: 600; flex: 1; }
  .player-host { font-size: 11px; color: var(--tier-a); text-transform: uppercase; letter-spacing: 1px; }
  .btn-start { width: 100%; max-width: 400px; margin-top: 16px; }
  .btn-start:disabled { opacity: .4; cursor: not-allowed; }
  .copy-link { color: var(--tier-a); font-size: 13px; margin-top: 12px; text-decoration: underline; cursor: pointer; }

  /* ===== GAME: ANSERING ===== */
  .theme-label {
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .theme-title {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 900;
    margin-bottom: 32px;
    line-height: 1.1;
  }
  .my-tier {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 16px;
    font-size: 3rem;
    font-weight: 900;
    color: white;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .timer {
    font-size: 4rem;
    font-weight: 900;
    text-align: center;
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }
  textarea {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  textarea:focus { border-color: var(--tier-a); }

  /* ===== GAME: DISCUSSION BOARD ===== */
  .tier-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 8px;
    margin-bottom: 8px;
    padding: 12px;
    border-radius: 12px;
    min-height: 80px;
  }
  .tier-row.s { background: rgba(229,57,53,.15); border-left: 4px solid var(--tier-s); }
  .tier-row.a { background: rgba(251,140,0,.15); border-left: 4px solid var(--tier-a); }
  .tier-row.b { background: rgba(253,216,53,.15); border-left: 4px solid var(--tier-b); }
  .tier-row.c { background: rgba(67,160,71,.15); border-left: 4px solid var(--tier-c); }
  .tier-row.f { background: rgba(30,136,229,.15); border-left: 4px solid var(--tier-f); }
  .tier-label {
    font-size: 2rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tier-label.s { color: var(--tier-s); }
  .tier-label.a { color: var(--tier-a); }
  .tier-label.b { color: var(--tier-b); }
  .tier-label.c { color: var(--tier-c); }
  .tier-label.f { color: var(--tier-f); }
  .answer-card {
    background: var(--card);
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.05);
    word-break: break-word;
  }
  .answer-card strong { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  /* ===== JUIZ / PODER ===== */
  .tier-options {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .tier-btn {
    padding: 20px 8px;
    border-radius: 12px;
    border: none;
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
    cursor: pointer;
    transition: transform .15s;
  }
  .tier-btn:active { transform: scale(.92); }
  .tier-btn.s { background: var(--tier-s); }
  .tier-btn.a { background: var(--tier-a); }
  .tier-btn.b { background: var(--tier-b); }
  .tier-btn.c { background: var(--tier-c); }
  .tier-btn.f { background: var(--tier-f); }
  .power-options {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 16px 0;
  }
  .power-btn {
    padding: 16px 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
  }
  .power-btn:disabled { opacity: .3; cursor: not-allowed; }
  .power-btn.up { border-color: var(--tier-c); }
  .power-btn.down { border-color: var(--tier-s); }

  .role-notice {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    padding: 16px 20px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }
  .discussing-notice {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    color: var(--muted);
    border: 2px solid rgba(255,255,255,0.05);
  }

  /* ===== REVIEW ===== */
  .review-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .tier-badge {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: white; font-size: 1.2rem;
  }
  .score-box {
    text-align: center;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    margin: 16px 0;
  }
  .score-box .num { font-size: 3rem; font-weight: 900; }
  .score-box .num.positive { color: var(--tier-c); }
  .score-box .num.negative { color: var(--tier-s); }

  /* ===== FINAL ===== */
  .final-score {
    display: grid;
    gap: 12px;
    margin: 16px 0;
  }
  .final-row {
    padding: 16px;
    background: var(--card);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .final-row.best { border: 2px solid var(--tier-c); }

  /* ===== RESPONSIVO ===== */
  @media (min-width: 768px) {
    .screen { padding: 40px; }
    .theme-title { font-size: 3rem; }
  }

  #gameContent { width:100%; min-width:0; max-width:1000px; margin:auto; }
  .entry-options { display:grid; grid-template-columns:1fr 1fr; gap:32px; width:100%; max-width:780px; margin:52px 0 28px; }
  .entry-options section { padding:24px; border:1px solid #ffffff20; border-radius:16px; background:var(--card); }
  .entry-options p { min-height:48px; margin-bottom:20px; line-height:1.5; }
  .palette { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .swatch { width:32px; height:32px; border:2px solid #ffffff50; border-radius:50%; cursor:pointer; }
  .swatch[aria-pressed="true"] { outline:3px solid white; outline-offset:3px; }
  .help { color:var(--text); line-height:1.6; background:var(--card); border:1px solid #ffffff20; padding:18px; border-radius:12px; margin:16px 0; }
  .people { color:var(--muted); line-height:1.8; margin:12px 0; }
  .people strong { color:var(--text); }
  .board-image { position:relative; max-width:700px; margin:20px auto; }
  .board-image img:not([hidden]) { display:block; width:100%; border-radius:16px; }
  .board-theme { background:#382013; border:2px solid #e8bb65; color:#fff3cd; border-radius:8px; padding:10px 18px; text-align:center; font-weight:800; overflow-wrap:anywhere; }
  .tier-row.e { background:#1e88e526; border-left:4px solid var(--tier-e); }
  .tier-row.f { background:#8e44ad26; }
  .tier-label.e { color:var(--tier-e); }
  .tier-btn.e { background:var(--tier-e); }
  .tier-label.b { color:var(--tier-b); } .tier-btn.b { color:#29220a; }
  .tier-row > div:last-child { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .grade { text-align:center; font-size:12px; display:grid; justify-items:center; gap:6px; }
  .tier-badge { width:52px; height:52px; }
  .review-row { grid-template-columns:1fr auto auto auto; }
  .kick { background:transparent; border:1px solid var(--tier-s); color:var(--text); padding:8px; border-radius:8px; cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  .connection-status { position:sticky; top:0; z-index:10; padding:12px 20px; background:#4a320d; color:#fff1cd; text-align:center; font-weight:600; }
  .theme-heading { border:1px solid #ffffff26; border-left:5px solid var(--tier-a); border-radius:16px; padding:20px 24px; margin:12px 0 24px; background:linear-gradient(120deg,var(--card),var(--bg)); }
  .theme-heading .theme-label { color:var(--tier-a); font-size:13px; font-weight:800; letter-spacing:3px; }
  .theme-heading .theme-title { margin:10px 0 0; font-size:clamp(1.5rem,5vw,2.8rem); line-height:1.2; overflow-wrap:anywhere; }
  .round-label { color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  @media(max-width:540px) { .entry-options { gap:12px; } .entry-options section { padding:14px 8px; } .entry-options .btn { padding:14px 8px; } .review-row { gap:8px; } .tier-row { grid-template-columns:44px 1fr; } .grade { font-size:10px; } }

/* Refined party-game interface */
:root { --text:#f8f7ff; --muted:#b8b9cc; }
body { background:radial-gradient(ellipse at 12% 0%, #63308a66, transparent 38%), radial-gradient(ellipse at 90% 15%, #bc4c5960, transparent 32%), var(--bg); background-attachment:fixed; line-height:1.5; }
.screen { padding:clamp(20px,4vw,48px) 20px 64px; }
#entry h1 { font-size:clamp(4rem,13vw,7.5rem); letter-spacing:-.075em; line-height:1; margin-bottom:20px; filter:drop-shadow(0 12px 30px #f3753740); }
#entry::before { content:'O JOGO DAS OPINIÕES'; color:#ffd38b; font-size:.72rem; font-weight:900; letter-spacing:.24em; margin-bottom:14px; }
#entry > p { color:var(--muted); margin:18px 0 10px; font-weight:600; }
.entry-options { width:min(100%,740px); margin:24px auto 10px; }
.entry-options section, .room-code-box, .help, .theme-heading, .review-row, .final-row, .score-box { border:1px solid #ffffff21; box-shadow:0 18px 42px #00000024; }
.entry-options section { border-radius:24px; background:linear-gradient(145deg,#ffffff10,transparent),var(--card); }
.entry-options section p { color:var(--muted); margin-bottom:14px; }
input, textarea { border:1px solid #ffffff32; background:#11111dbb; color:var(--text); border-radius:14px; }
input:focus, textarea:focus, button:focus-visible { outline:3px solid #ffd381; outline-offset:3px; }
.btn { border-radius:14px; font-weight:800; transition:transform .18s,filter .18s; }
.btn:hover:not(:disabled), .power-btn:hover:not(:disabled), .tier-btn:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.1); }
.btn-primary { color:#25110a; box-shadow:0 8px 24px #f18b3240; }
.btn-secondary { border:1px solid #ffffff35; }
#game, #lobby { width:100%; max-width:880px; min-width:0; margin:auto; }
#gameContent > .kick:first-child, #lobby > .kick { align-self:flex-start; margin-bottom:20px; }
.kick { border-radius:12px; padding:9px 13px; }
.theme-heading { border-left:0; border-radius:24px; padding:24px; background:linear-gradient(120deg,#9c4e6440,#c5792922),var(--card); }
.theme-label, .round-label { color:#ffd08a; font-weight:800; letter-spacing:.13em; }
.theme-title { font-size:clamp(1.7rem,5vw,2.8rem); line-height:1.15; }
.help, .score-box { border-radius:20px; background:linear-gradient(145deg,#ffffff0a,transparent),var(--card); padding:20px; }
.help p + p { margin-top:12px; }
.people { color:var(--muted); line-height:1.6; }
.people strong { color:var(--text); }
.board-image { padding:16px; border-radius:22px; background:#0b0b13a8; border:1px solid #ffffff1c; }
.tier-row { border-radius:12px; overflow:hidden; margin:6px 0; min-height:56px; }
.tier-label { border-radius:9px; }
.answer-card { border:1px solid #ffffff1c; border-radius:16px; background:var(--card); padding:16px; overflow-wrap:anywhere; }
.timer { font-variant-numeric:tabular-nums; color:#ffd28d; }
.review-row { border-radius:20px; padding:16px; margin:12px 0; gap:12px; grid-template-columns:minmax(0,1fr) auto auto auto auto; }
.final-row { border-radius:16px; margin:9px 0; padding:15px 18px; }
#gameContent h2 { margin:32px 0 14px; font-size:1.3rem; }
.power-btn, .tier-btn { border-radius:14px; transition:transform .18s,filter .18s; }
@media(max-width:600px) { .screen { padding:22px 14px 48px; } .review-row { grid-template-columns:1fr auto auto; } .review-row > div:first-child { grid-column:1 / -1; } .tier-options { gap:6px; } .tier-btn { min-width:0; } .theme-heading { padding:20px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }


/* Rankings and spacing */
#gameContent > * + * { margin-top:20px; }
#gameContent .ranking-section { margin-top:52px; }
#gameContent .ranking-section h2 { margin:0 0 24px; }
.final-heading { text-align:center; padding:30px 16px; }
.final-heading h1 { margin:12px 0; }
.final-heading p { color:var(--muted); }
.podium { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; padding:8px 12px 20px; }
.podium-card, .liked-card { --glow:#fa3048; display:flex; align-items:center; min-width:0; min-height:112px; border:2px solid var(--glow); border-left-width:8px; border-radius:22px; background:linear-gradient(110deg,#1d1017,#0b0b10 70%); box-shadow:0 0 12px var(--glow),0 0 28px color-mix(in srgb,var(--glow),transparent 50%),inset 0 0 20px color-mix(in srgb,var(--glow),transparent 90%); padding:14px 20px; }
.podium-card.place-1 { grid-column:1 / -1; width:min(100%, 380px); justify-self:center; }
.podium-card.place-2 { --glow:#bde31a; }
.podium-card.place-3 { --glow:#7e35f4; }
.rank-number { color:var(--glow); font-weight:900; font-size:clamp(2.4rem,5vw,3.6rem); line-height:1; padding-right:20px; margin-right:20px; border-right:1px solid var(--glow); flex:none; }
.rank-label { display:flex; flex-direction:column; gap:5px; min-width:0; overflow-wrap:anywhere; }
.rank-label strong { font-size:1.1rem; }
.rank-label small { color:#ddd8e9; font-size:.88rem; }
.liked-ranking { display:grid; gap:20px; padding:8px; }
.liked-card { min-height:90px; }
.liked-card.rank-2 { --glow:#ff9200; }.liked-card.rank-3 { --glow:#ffe52a; }.liked-card.rank-4 { --glow:#23dc69; }.liked-card.rank-5 { --glow:#1f9bff; }
.other-places { display:grid; gap:8px; color:var(--muted); padding:12px 20px; }
.other-places .rank-label { display:inline; }
.other-places small { margin-left:8px; }
.board-fallback .tier-row { margin:8px 0; }
.tier-options, .power-options { gap:12px; margin:22px 0; }
.discussing-notice { margin:20px 0; }
.review-row .grade { min-width:0; text-align:center; }
.review-row button { min-width:46px; }
@media(max-width:600px) { .podium { grid-template-columns:minmax(0,1fr); gap:16px; padding:6px; } .podium-card.place-1 { grid-column:auto; width:100%; } .podium-card,.liked-card { min-height:86px; padding:12px 14px; } .rank-number { padding-right:14px; margin-right:14px; } #gameContent .ranking-section { margin-top:38px; } .review-row { grid-template-columns:repeat(3,minmax(0,1fr)); } .review-row > :first-child { grid-column:1/-1; } .review-row .grade { font-size:.72rem; } }

</style>

<body>
<div id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden></div>

<!-- TELA 1: ENTRADA -->
<div id="entry" class="screen active">
  <h1>TIER DU</h1>
  <input id="inputName" type="text" placeholder="Seu nome" maxlength="20" />
  <div class="entry-options">
    <section><p>Crie uma nova partida com os amigos</p><button class="btn btn-primary" id="btnCreate">Criar sala</button></section>
    <section><p>Entre em uma sala existente</p><input id="inputCode" aria-label="Código da sala" placeholder="Código" maxlength="4" style="text-transform:uppercase"><button class="btn btn-primary" id="btnJoin">Entrar</button></section>
  </div>
  <p>Escolha a cor do jogo</p><div class="palette" id="palette"></div>
</div>

<!-- TELA 2: LOBBY -->
<div id="lobby" class="screen">
  <div class="room-code-box">
    <small>Código da sala</small>
    <div class="code" id="displayCode">----</div>
  </div>
  <div class="players-list" id="playersList"></div>
  <button class="btn btn-primary btn-start" id="btnStart" disabled>Iniciar partida (3+ jogadores)</button>
  <button class="kick" onclick="leaveGame()">Sair da partida</button>
  <div class="copy-link" id="copyLink">Copiar link da sala</div>
</div>

<!-- TELA 3: GAME -->
<div id="game" class="screen">
  <div id="gameContent"></div>
</div>

<script>
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
const TIERS=['S','A','B','C','E','F'];
const LABELS={S:'Lendários',A:'Excelentes',B:'Bons',C:'Mais ou menos',E:'Ruim',F:'Desastrosos'};
const NOTES={S:'10',A:'9 e 8',B:'7 e 6,5',C:'6,5 e 5',E:'4, 3 e 2',F:'1 e 0'};
let ws, myState={}, timerInterval, draftKey='', draft='';
const SESSION_KEY='tier-du-session-v1';
let session=null, reconnectTimer, reconnectAttempt=0, heartbeatInterval, lastMessageAt=0, awaitingState=false;
function readSession() {
 try { const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||'null'); return s?.token&&s?.code?s:null; } catch {return null;}
}
function saveSession() {
 if(!session) return;
 session.snapshot=myState.phase?myState:session.snapshot;
 session.draftKey=draftKey; session.draft=draft;
 const value=JSON.stringify(session);
 try {sessionStorage.setItem(SESSION_KEY,value);} catch {}
 try {localStorage.setItem(SESSION_KEY,value);} catch {}
}
function clearSession() {
 session=null; clearTimeout(reconnectTimer); reconnectTimer=null; clearInterval(heartbeatInterval);
 try {sessionStorage.removeItem(SESSION_KEY);} catch {}
 try {localStorage.removeItem(SESSION_KEY);} catch {}
}
function connectionStatus(text='') {
 const el=document.getElementById('connectionStatus'); el.textContent=text; el.hidden=!text;
 document.querySelectorAll('#lobby button, #game button').forEach(button=>{
  if(text) {if(!button.hasAttribute('data-before-disconnect')) button.dataset.beforeDisconnect=String(button.disabled); button.disabled=true;}
  else if(button.hasAttribute('data-before-disconnect')) {button.disabled=button.dataset.beforeDisconnect==='true';delete button.dataset.beforeDisconnect;}
 });
}
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(type,data) { if(ws?.readyState===WebSocket.OPEN && (!awaitingState || type==='join' || type==='ping')) ws.send(JSON.stringify({type,data})); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); }
function scheduleReconnect() {
 if(!session || reconnectTimer) return;
 connectionStatus('Reconectando à sala… Sua vaga e seu rascunho estão guardados.');
 const delay=Math.min(1000*2**Math.min(reconnectAttempt++,4),10000);
 reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect(session.name,session.code,session.token);},delay);
}
function connect(name,code,token='') {
 if(ws && [WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState)) return;
 const socket=new WebSocket(WS_URL); ws=socket; awaitingState=true;
 if(token) connectionStatus('Reconectando à sala… Sua vaga e seu rascunho estão guardados.');
 socket.onopen=()=>send('join',{name,code,token});
 socket.onmessage=ev=>{
  if(ws!==socket) return;
  lastMessageAt=Date.now();
  const d=JSON.parse(ev.data);
  if(d.type==='pong') return;
  if(d.type==='sessionReplaced') {
   session=null; clearTimeout(reconnectTimer); reconnectTimer=null; clearInterval(heartbeatInterval);
   try {sessionStorage.removeItem(SESSION_KEY);} catch {}
   ws=null; socket.close(); showScreen('entry');
   connectionStatus('Sua sala foi aberta em outra aba. Continue jogando por lá.');
   return;
  }
  if(d.type==='joined') {
   myState={...myState,code:d.code,host:d.host,name:d.name||name};
   session={...session,code:d.code,name:d.name||name,token:d.token}; saveSession();
   document.getElementById('displayCode').textContent=d.code;
   return;
  }
  if(d.error) {
   const errors={sala_nao_encontrada:'Sala não encontrada.',nome_invalido:'Use um nome de até 20 caracteres.',nome_duplicado:'Esse nome já está em uso nesta sala. Escolha outro nome.',partida_em_andamento:'Esta partida já começou.',removido:'O host removeu você da sala.',sessao_expirada:'Esta sala não está mais disponível. Crie uma nova sala ou entre em outra.'};
   clearSession(); ws=null; socket.close(); connectionStatus(); showScreen('entry'); alert(errors[d.error]||d.error); return;
  }
  awaitingState=false; reconnectAttempt=0; clearTimeout(reconnectTimer); reconnectTimer=null;
  renderState(d);
  connectionStatus();
  clearInterval(heartbeatInterval);
  heartbeatInterval=setInterval(()=>{
   if(Date.now()-lastMessageAt>45000) {socket.close();return;}
   send('ping');
  },15000);
 };
 socket.onclose=()=>{
  if(ws!==socket) return;
  clearInterval(heartbeatInterval); saveSession();
  if(session) scheduleReconnect();
  else {awaitingState=false;connectionStatus('Não foi possível conectar. Tente criar ou entrar na sala novamente.');showScreen('entry');}
 };
 socket.onerror=()=>socket.close();
}
document.getElementById('btnCreate').onclick=()=>{const n=document.getElementById('inputName').value.trim(); if(n) connect(n,''); else alert('Digite seu nome');};
document.getElementById('btnJoin').onclick=()=>{const n=document.getElementById('inputName').value.trim(),c=document.getElementById('inputCode').value.trim().toUpperCase(); if(n&&c) connect(n,c); else alert('Digite seu nome e o código da sala');};
document.getElementById('btnStart').onclick=()=>send('start');
document.getElementById('copyLink').onclick=async()=>{try {await navigator.clipboard.writeText(`${location.origin}/?code=${myState.code}`); alert('Link copiado!');} catch {alert(`Código da sala: ${myState.code}`);} };
const palettes={Preto:['#0f1117','#1a1d28'],Vermelho:['#260f14','#401b24'],Amarelo:['#292308','#413916'],Azul:['#0c192e','#162b46'],Roxo:['#21112e','#352042'],Rosa:['#2e1125','#452039'],Verde:['#0d2419','#1b382b'],Laranja:['#2d190c','#442b1a']};
const swatches=['#111111','#e53935','#fdd835','#1e88e5','#8e44ad','#ec4899','#43a047','#fb8c00'];
function setPalette(name) {if(!palettes[name]) name='Preto'; const [bg,card]=palettes[name]; document.documentElement.style.setProperty('--bg',bg); document.documentElement.style.setProperty('--card',card); document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.title===name))); try {localStorage.setItem('tier-du-color',name);} catch {} }
document.getElementById('palette').innerHTML=Object.keys(palettes).map((n,i)=>`<button class="swatch" title="${n}" aria-label="${n}" style="background:${swatches[i]}" onclick="setPalette('${n}')"></button>`).join('');
let saved='Preto'; try {saved=localStorage.getItem('tier-du-color')||saved;} catch {} setPalette(saved);
function renderState(d) {
 const input=document.getElementById('answerText');
 const sameDraft=d.phase==='answering' && draftKey===`${d.code}:${d.round}:${d.revision}`;
 const focused=sameDraft && document.activeElement===input && !!input;
 const selection=input?[input.selectionStart,input.selectionEnd]:null;
 if(input && myState.phase==='answering') draft=input.value;
 myState={...myState,...d}; clearInterval(timerInterval);
 saveSession();
 renderLobby(d.players||[],d.canStart);
 if(d.phase==='lobby') {showScreen('lobby'); return;}
 if(d.phase==='answering' && myState._themeRevision!==undefined && myState._themeRound===d.round && myState._themeRevision!==d.revision) alert('O tema mudou!');
 myState._themeRevision=d.revision; myState._themeRound=d.round;
 showScreen('game');
 ({instructions:renderInstructions,answering:renderAnswering,discussing:renderDiscussing,power:renderPower,changes:renderChanges,review:renderReview,final:renderFinal}[d.phase]||(()=>{}))(d);
 if(!['instructions','review'].includes(d.phase)) document.getElementById('gameContent').insertAdjacentHTML('afterbegin',`<button class="kick" onclick="leaveGame()">Sair da partida</button>`);
 if(focused) {const next=document.getElementById('answerText'); if(next) {next.focus(); next.setSelectionRange(...selection);} }
}
function renderLobby(players,canStart) {
 document.getElementById('playersList').innerHTML=players.map(p=>`<div class="player-row"><div class="player-avatar">${esc(p.name.charAt(0).toUpperCase())}</div><div class="player-name">${esc(p.name)}${p.connected===false?' (desconectado)':''}</div>${p.host?'<div class="player-host">Host</div>':myState.host&&myState.phase==='lobby'?`<button class="kick" onclick="send('kick',{playerID:'${p.id}'})">Remover</button>`:''}</div>`).join('');
 document.getElementById('btnStart').disabled=!canStart;
 document.getElementById('btnStart').textContent=myState.host?'Iniciar partida (3+ jogadores)':'Aguardando o host iniciar';
}
function heading(d) {return `<div class="round-label">Rodada ${d.round} de 3</div><header class="theme-heading"><div class="theme-label">Tema da rodada</div><h1 class="theme-title">${esc(d.currentTheme)}</h1></header>`;}
function people(d) {return `<div class="people">Resposta de <strong>${esc(d.discussingPlayerName)}</strong><br>Líder: <strong>${esc(d.judgeName)}</strong></div>`;}
function badge(t) {return `<div class="tier-badge" role="img" aria-label="Nota ${esc(t)}" style="background:var(--tier-${String(t).toLowerCase()});${t==='B'?'color:#29220a':''}">${esc(t)}</div>`;}
function board(d) {return TIERS.map(t=>`<div class="tier-row ${t.toLowerCase()}"><div class="tier-label ${t.toLowerCase()}">${t}</div><div>${(d.board||[]).filter(a=>a.placed===t).map(a=>`<div class="answer-card"><strong>${esc(a.playerName)}</strong>${esc(a.text)}</div>`).join('')}</div></div>`).join('');}
function renderAnswering(d) {
 const key=`${d.code}:${d.round}:${d.revision}`;
 if(key!==draftKey) {draftKey=key; draft='';saveSession();}
 document.getElementById('gameContent').innerHTML=`${heading(d)}

 <div class="board-image"><img hidden src="/static/board.png" alt="Tabuleiro Tier Du" onload="this.hidden=false;this.nextElementSibling.hidden=true" onerror="this.remove()"><div class="board-fallback">${TIERS.map(t=>`<div class="tier-row ${t.toLowerCase()}"><div class="tier-label ${t.toLowerCase()}">${t}</div><div>${LABELS[t]} (${NOTES[t]})</div></div>`).join('')}</div><div class="board-theme">Tema da vez: ${esc(d.currentTheme)}</div></div>
 <div style="text-align:center">Sua letra secreta:<br><div class="my-tier" style="background:var(--tier-${d.myTier.toLowerCase()})">${d.myTier}</div><div>${LABELS[d.myTier]} (${NOTES[d.myTier]})</div></div>
 <div class="people">Autor: <strong>${esc(myState.name)}</strong><br>Líder da sua resposta: <strong>${esc(d.myLeaderName)}</strong></div>
 <div class="timer" id="timer"></div>
 ${d.iAnswered?`<div class="help">Resposta confirmada: ${esc(d.myAnswer)} <button class="kick" aria-label="Editar resposta" onclick="send('editAnswer')">✏️</button></div>`:'<textarea id="answerText" aria-label="Sua resposta" placeholder="Escreva sua resposta..." maxlength="100"></textarea><button class="btn btn-primary" id="btnAnswer">Confirmar resposta</button>'}

 <button class="btn btn-secondary" onclick="send('changeTheme')" ${d.iVotedTheme?'disabled':''}>${d.iVotedTheme?'Voto registrado':'Votar para trocar tema'}</button><p class="people">${d.themeVotes} de ${d.themeVotesNeeded} votos necessários</p>`;
 if(d.iAnswered) draft=d.myAnswer||draft;
 if(!d.iAnswered) {const input=document.getElementById('answerText'); input.value=draft; input.oninput=()=>{draft=input.value;saveSession();}; document.getElementById('btnAnswer').onclick=()=>{const text=input.value.trim(); if(text) send('answer',{text}); else alert('Escreva uma resposta');};}
 startTimer(d.timerEnd);
}
function renderDiscussing(d) {
 const role=d.iAmTarget?'Sua resposta está sendo discutida. Ouça a conversa e não revele sua letra original.':d.iAmJudge?'Você é o líder desta resposta. Ouça todos e selecione abaixo a nota que o grupo fechou em consenso.':'Discuta com o grupo em qual ranking esta resposta se encaixa. O líder registrará a decisão de vocês.';
 document.getElementById('gameContent').innerHTML=`${heading(d)}${people(d)}<div class="answer-card">${esc(d.discussingText)}</div>${board(d)}${d.iAmJudge?`<div class="tier-options">${TIERS.map(t=>`<button class="tier-btn ${t.toLowerCase()}" onclick="send('judge',{tier:'${t}'})">${t}</button>`).join('')}</div>`:'<div class="discussing-notice">Aguardando o líder registrar o consenso.</div>'}`;
}
function renderPower(d) {
 const disabled=d.myUsedPower||d.iAmTarget||d.myPowerChosen;
 document.getElementById('gameContent').innerHTML=`${heading(d)}${people(d)}<div class="answer-card">${esc(d.discussingText)}</div><div class="grade">Nota escolhida${badge(d.placed)}</div>

 <div class="discussing-notice">${d.iAmTarget?'Você é o autor e não pode usar poder nesta resposta.':d.myPowerChosen?'Decisão registrada. Aguarde os demais.':d.myUsedPower?'Você já usou seu poder neste tema. Confirme para continuar.':'Escolha seu poder ou passe a vez.'}</div>
 <div class="timer" id="timer"></div><div class="power-options"><button class="power-btn up" ${disabled?'disabled':''} onclick="send('power',{choice:1})">↑ Subir 1 tier</button><button class="power-btn" ${d.iAmTarget||d.myPowerChosen?'disabled':''} onclick="send('power',{choice:0})">Não fazer nada</button><button class="power-btn down" ${disabled?'disabled':''} onclick="send('power',{choice:-1})">↓ Descer 1 tier</button></div>${board(d)}`;
 startTimer(d.timerEnd);
}
function renderChanges(d) {
 const change=d.changes[0];
 document.getElementById('gameContent').innerHTML=`${heading(d)}<h2>O que os poderes mudaram</h2>${people(d)}<div class="answer-card">${esc(d.discussingText)}</div><div class="help">${d.changes.map(c=>`<p><strong>${esc(c.playerName)}</strong>: ${c.choice===1?'↑ pediu para subir 1 tier':'↓ pediu para descer 1 tier'}</p>`).join('')}</div><div class="review-row"><div>Resultado dos poderes${change.before===change.after?'<p>A nota permaneceu igual: poderes opostos se anulam e os limites são S e F.</p>':''}</div><div class="grade">Antes${badge(change.before)}</div><div class="grade">Depois${badge(change.after)}</div></div><div class="timer" id="timer"></div>${d.host?'<button class="btn btn-primary" onclick="send(\'continue\')">Continuar</button>':'<p>A próxima etapa começa automaticamente.</p>'}`;
 startTimer(d.timerEnd);
}
function resultRows(r,round,showLikes=false) {return r.answers.map(a=>{const diff=Math.abs(TIERS.indexOf(a.original)-TIERS.indexOf(a.placed)),pts=diff===0?3:diff===1?1:3-2*diff; return `<div class="review-row"><div><strong>${esc(a.playerName)}</strong><br><span style="color:var(--muted)">${esc(a.text)}</span>${a.leaderName?`<br><small>Líder: ${esc(a.leaderName)}</small>`:''}</div><div class="grade">Nota escolhida${badge(a.placed)}</div><div class="grade">Nota original${badge(a.original)}</div><button class="kick" ${a.playerId===myState.myID?'disabled':''} onclick="send('like',{round:${round},owner:'${a.playerId}'})">${a.likes?.[myState.myID]?'❤️':'🤍'}${showLikes?` ${Object.keys(a.likes||{}).length}`:''}</button><strong>${pts>0?'+':''}${pts}</strong></div>`;}).join('');}
function renderReview(d) {const r=d.review; document.getElementById('gameContent').innerHTML=`${heading(d)}<div class="score-box"><div>Pontuação do grupo</div><div class="num ${r.score>=0?'positive':'negative'}">${r.score>0?'+':''}${r.score}</div></div>${resultRows(r,d.round-1)}${d.host?`<button class="btn btn-primary" onclick="send('nextRound')">${d.nextRound?'Próximo tema →':'Ver resultado final'}</button>`:'<p class="help">Aguardando o host continuar.</p>'}`;}
function renderInstructions(d) { document.getElementById('gameContent').innerHTML=`<h1>Como jogar 🎮</h1><div class="help"><p>Todos formam um time e tentam acertar a letra secreta de cada resposta.</p><p>Cada jogador recebe uma letra e escreve uma resposta que combine com ela. Quando sua resposta estiver em discussão, fique em silêncio e não demonstre sua letra.</p><p>Os demais discutem em qual posição a resposta deve ficar. O líder registra o consenso; ele muda a cada resposta.</p><p>Depois da discussão, você pode subir ou descer uma posição quando achar que o grupo errou e quiser corrigir a decisão. O poder pode ser usado uma vez por tema, e não na própria resposta. Poderes opostos se anulam.</p><p>Exemplo: se a letra secreta e a escolha do grupo são S, subir não altera a letra nem sua pontuação em Gênios das alterações.</p><p>Curta as respostas que achou muito boas, engraçadas ou com as quais concorda. Você não pode curtir sua própria resposta.</p></div><p>${d.readyCount} de ${d.connectedCount} prontos</p><button class="btn btn-primary" ${d.ready?'disabled':''} onclick="send('ready')">${d.ready?'Aguardando os jogadores':'Prosseguir com o jogo'}</button>`; }
function leaveGame() {send('leave'); clearSession(); ws=null; location.reload();}
function renderFinal(d) {
 const total=d.results.reduce((s,r)=>s+r.score,0);
 const answers=d.results.flatMap((r,i)=>r.answers.map(a=>({...a,round:i})));
 const score=a=>{const x=Math.abs(TIERS.indexOf(a.original)-TIERS.indexOf(a.placed));return x===0?3:x===1?1:3-2*x};
 const players=(d.players||[]).map(p=>({...p,points:answers.filter(a=>a.playerId===p.id).reduce((n,a)=>n+score(a),0)}));
 const podium=(items, label)=>`<div class="podium">${items.slice(0,3).map((item,i)=>`<div class="podium-card place-${i+1}"><span class="rank-number">${i+1}º</span><div class="rank-label">${label(item)}</div></div>`).join('')}</div>${items.length>3?`<div class="other-places">${items.slice(3).map((item,i)=>`<div>${i+4}º · ${label(item)}</div>`).join('')}</div>`:''}`;
 const rounds=d.results.map((r,i)=>({...r,n:i+1})).sort((a,b)=>b.score-a.score);
 const best=[...players].sort((a,b)=>b.points-a.points);
 const genius=[...players].sort((a,b)=>b.genius-a.genius);
 const liked=[...answers].sort((a,b)=>Object.keys(b.likes||{}).length-Object.keys(a.likes||{}).length).slice(0,5);
 document.getElementById('gameContent').innerHTML=`<div class="final-heading"><span class="round-label">FIM DE JOGO</span><h1>Resultado final 🏆</h1><div class="timer">${total>0?'+':''}${total}</div><p>Pontos do grupo</p></div>
 <section class="ranking-section"><h2>🏅 Pódio das rodadas</h2>${podium(rounds,r=>`<strong>Rodada ${r.n}</strong><span>${esc(r.theme)}</span><small>${r.score} pontos</small>`)}</section>
 <section class="ranking-section"><h2>🌟 Quem dá as melhores respostas</h2>${podium(best,p=>`<strong>${esc(p.name)}</strong><small>${p.points} pontos</small>`)}</section>
 <section class="ranking-section"><h2>❤️ As 5 respostas mais curtidas</h2><div class="liked-ranking">${liked.map((a,i)=>`<div class="liked-card rank-${i+1}"><span class="rank-number">${i+1}</span><div class="rank-label"><strong>${esc(a.text)}</strong><small>${esc(a.playerName)} · ${Object.keys(a.likes||{}).length} curtidas</small></div></div>`).join('')}</div></section>
 <section class="ranking-section"><h2>🧠 Gênios das alterações</h2><p class="help">Se o grupo escolheu S e a letra secreta também era S, subir não muda a letra nem a pontuação neste gráfico.</p>${podium(genius,p=>`<strong>${esc(p.name)}</strong><small>${p.genius>0?'+':''}${p.genius} pontos</small>`)}</section>
 ${d.results.map((r,i)=>`<section class="ranking-section"><h2>${esc(r.theme)}</h2>${resultRows(r,i,true)}</section>`).join('')}<button class="btn btn-secondary" onclick="leaveGame()">Jogar de novo</button>`;
}
function startTimer(end) {clearInterval(timerInterval); const tick=()=>{const el=document.getElementById('timer'); const seconds=Math.max(0,Math.ceil((end-Date.now())/1000)); if(el) el.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}; tick(); timerInterval=setInterval(tick,250);}
const code=new URLSearchParams(location.search).get('code'); if(code) document.getElementById('inputCode').value=code;
function resumeOnReturn() {
 saveSession();
 if(!session || document.visibilityState==='hidden') return;
 clearTimeout(reconnectTimer); reconnectTimer=null;
 if(ws?.readyState===WebSocket.OPEN && Date.now()-lastMessageAt<=45000) {send('ping');return;}
 const old=ws; ws=null; old?.close();
 connect(session.name,session.code,session.token);
}
document.addEventListener('visibilitychange',resumeOnReturn);
window.addEventListener('online',resumeOnReturn);
window.addEventListener('pageshow',event=>{if(event.persisted) resumeOnReturn();});
window.addEventListener('pagehide',saveSession);
session=readSession();
if(session && (!code || code.toUpperCase()===session.code)) {
 draftKey=session.draftKey||'';draft=session.draft||'';
 if(session.snapshot?.phase) {myState=session.snapshot;renderState(myState);document.getElementById('displayCode').textContent=session.code;}
 connect(session.name,session.code,session.token);
} else if(session && code) {clearSession();}

</script>
