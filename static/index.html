<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tier Du</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d28;
    --text: #f0f0f5;
    --muted: #8b8fa3;
    --tier-s: #e53935;
    --tier-a: #fb8c00;
    --tier-b: #fdd835;
    --tier-c: #43a047;
    --tier-e: #1e88e5;
 --tier-f: #8e44ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .screen { display: none; padding: 20px; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== TELA DE ENTRADA ===== */
  #entry { justify-content: center; align-items: center; text-align: center; }
  #entry h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a), var(--tier-b), var(--tier-c), var(--tier-e), var(--tier-f));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 32px;
  }
  input {
    width: 100%;
    max-width: 360px;
    padding: 16px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    margin-bottom: 12px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: var(--tier-a); }
  .btn {
    padding: 16px 32px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    width: 100%;
    max-width: 360px;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    color: white;
    box-shadow: 0 4px 16px rgba(229,57,53,0.3);
  }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.1);
  }
  #btnJoin {
    box-shadow: 0 4px 22px rgba(229,57,53,0.45), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .or-divider {
    color: var(--muted);
    font-size: 13px;
    margin: 8px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ===== LOBBY ===== */
  #lobby { align-items: center; }
  .room-code-box {
    background: linear-gradient(135deg, var(--tier-s), var(--tier-a));
    padding: 20px 40px;
    border-radius: 16px;
    margin-bottom: 24px;
    text-align: center;
  }
  .room-code-box small { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: .9; }
  .room-code-box .code { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; letter-spacing: 8px; }
  .players-list {
    width: 100%;
    max-width: 400px;
    margin-bottom: 24px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  .player-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px;
  }
  .player-name { font-weight: 600; flex: 1; }
  .player-host { font-size: 11px; color: var(--tier-a); text-transform: uppercase; letter-spacing: 1px; }
  .btn-start { width: 100%; max-width: 400px; margin-top: 16px; }
  .btn-start:disabled { opacity: .4; cursor: not-allowed; }
  .copy-link { color: var(--tier-a); font-size: 13px; margin-top: 12px; text-decoration: underline; cursor: pointer; }

  /* ===== GAME: ANSERING ===== */
  .theme-label {
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .theme-title {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 900;
    margin-bottom: 32px;
    line-height: 1.1;
  }
  .my-tier {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 16px;
    font-size: 3rem;
    font-weight: 900;
    color: white;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .timer {
    font-size: 4rem;
    font-weight: 900;
    text-align: center;
    margin: 16px 0;
    font-variant-numeric: tabular-nums;
  }
  textarea {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
  }
  textarea:focus { border-color: var(--tier-a); }

  /* ===== GAME: DISCUSSION BOARD ===== */
  .tier-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 8px;
    margin-bottom: 8px;
    padding: 12px;
    border-radius: 12px;
    min-height: 80px;
  }
  .tier-row.s { background: rgba(229,57,53,.15); border-left: 4px solid var(--tier-s); }
  .tier-row.a { background: rgba(251,140,0,.15); border-left: 4px solid var(--tier-a); }
  .tier-row.b { background: rgba(253,216,53,.15); border-left: 4px solid var(--tier-b); }
  .tier-row.c { background: rgba(67,160,71,.15); border-left: 4px solid var(--tier-c); }
  .tier-row.f { background: rgba(30,136,229,.15); border-left: 4px solid var(--tier-f); }
  .tier-label {
    font-size: 2rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tier-label.s { color: var(--tier-s); }
  .tier-label.a { color: var(--tier-a); }
  .tier-label.b { color: var(--tier-b); }
  .tier-label.c { color: var(--tier-c); }
  .tier-label.f { color: var(--tier-f); }
  .answer-card {
    background: var(--card);
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.05);
    word-break: break-word;
  }
  .answer-card strong { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  /* ===== JUIZ / PODER ===== */
  .tier-options {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .tier-btn {
    padding: 20px 8px;
    border-radius: 12px;
    border: none;
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
    cursor: pointer;
    transition: transform .15s;
  }
  .tier-btn:active { transform: scale(.92); }
  .tier-btn.s { background: var(--tier-s); }
  .tier-btn.a { background: var(--tier-a); }
  .tier-btn.b { background: var(--tier-b); }
  .tier-btn.c { background: var(--tier-c); }
  .tier-btn.f { background: var(--tier-f); }
  .power-options {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 16px 0;
  }
  .power-btn {
    padding: 16px 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
  }
  .power-btn:disabled { opacity: .3; cursor: not-allowed; }
  .power-btn.up { border-color: var(--tier-c); }
  .power-btn.down { border-color: var(--tier-s); }

  .role-notice {
    background: linear-gradient(135deg, var(--tier-a), var(--tier-s));
    padding: 16px 20px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }
  .discussing-notice {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    color: var(--muted);
    border: 2px solid rgba(255,255,255,0.05);
  }

  /* ===== REVIEW ===== */
  .review-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .tier-badge {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: white; font-size: 1.2rem;
  }
  .score-box {
    text-align: center;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    margin: 16px 0;
  }
  .score-box .num { font-size: 3rem; font-weight: 900; }
  .score-box .num.positive { color: var(--tier-c); }
  .score-box .num.negative { color: var(--tier-s); }

  /* ===== FINAL ===== */
  .final-score {
    display: grid;
    gap: 12px;
    margin: 16px 0;
  }
  .final-row {
    padding: 16px;
    background: var(--card);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .final-row.best { border: 2px solid var(--tier-c); }

  /* ===== RESPONSIVO ===== */
  @media (min-width: 768px) {
    .screen { padding: 40px; }
    .theme-title { font-size: 3rem; }
  }

  #gameContent { width:100%; min-width:0; max-width:1000px; margin:auto; }
  .entry-options { display:grid; grid-template-columns:1fr 1fr; gap:32px; width:100%; max-width:780px; margin:52px 0 28px; }
  .entry-options section { padding:24px; border:1px solid #ffffff20; border-radius:16px; background:var(--card); }
  .entry-options p { min-height:48px; margin-bottom:20px; line-height:1.5; }
  .palette { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .swatch { width:32px; height:32px; border:2px solid #ffffff50; border-radius:50%; cursor:pointer; }
  .swatch[aria-pressed="true"] { outline:3px solid white; outline-offset:3px; }
  .help { color:var(--text); line-height:1.6; background:var(--card); border:1px solid #ffffff20; padding:18px; border-radius:12px; margin:16px 0; }
  .people { color:var(--muted); line-height:1.8; margin:12px 0; }
  .people strong { color:var(--text); }
  .board-image { position:relative; max-width:700px; margin:20px auto; }
  .board-image img:not([hidden]) { display:block; width:100%; border-radius:16px; }
  .board-theme { background:#382013; border:2px solid #e8bb65; color:#fff3cd; border-radius:8px; padding:10px 18px; text-align:center; font-weight:800; overflow-wrap:anywhere; }
  .tier-row.e { background:#1e88e526; border-left:4px solid var(--tier-e); }
  .tier-row.f { background:#8e44ad26; }
  .tier-label.e { color:var(--tier-e); }
  .tier-btn.e { background:var(--tier-e); }
  .tier-label.b { color:var(--tier-b); } .tier-btn.b { color:#29220a; }
  .tier-row > div:last-child { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .grade { text-align:center; font-size:12px; display:grid; justify-items:center; gap:6px; }
  .tier-badge { width:52px; height:52px; }
  .review-row { grid-template-columns:1fr auto auto auto; }
  .kick { background:transparent; border:1px solid var(--tier-s); color:var(--text); padding:8px; border-radius:8px; cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  .connection-status { position:sticky; top:0; z-index:10; padding:12px 20px; background:#4a320d; color:#fff1cd; text-align:center; font-weight:600; }
  .theme-heading { border:1px solid #ffffff26; border-left:5px solid var(--tier-a); border-radius:16px; padding:20px 24px; margin:12px 0 24px; background:linear-gradient(120deg,var(--card),var(--bg)); }
  .theme-heading .theme-label { color:var(--tier-a); font-size:13px; font-weight:800; letter-spacing:3px; }
  .theme-heading .theme-title { margin:10px 0 0; font-size:clamp(1.5rem,5vw,2.8rem); line-height:1.2; overflow-wrap:anywhere; }
  .round-label { color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  @media(max-width:540px) { .entry-options { gap:12px; } .entry-options section { padding:14px 8px; } .entry-options .btn { padding:14px 8px; } .review-row { gap:8px; } .tier-row { grid-template-columns:44px 1fr; } .grade { font-size:10px; } }
  .leave-toolbar { position:sticky; top:0; z-index:11; background:var(--bg); padding:10px 20px; text-align:right; border-bottom:1px solid #ffffff15; }
  .leave-toolbar[hidden] { display:none; }
  .tier-label { flex-direction:column; line-height:1.1; gap:6px; }
  .tier-label small { font-size:9px; font-weight:600; text-align:center; line-height:1.3; }
  .tier-description { font-size:13px; color:var(--muted); width:100%; }
  .tier-btn small { display:block; font-size:9px; margin-top:5px; }
  .tier-badge { flex-direction:column; gap:2px; width:58px; height:58px; }
  .tier-badge small { font-size:8px; font-weight:600; }
  .intro-title { font-size:clamp(2rem,6vw,3rem); margin:18px 0; }
  .intro-lead { font-size:18px; line-height:1.6; margin-bottom:24px; color:var(--muted); }
  .rules-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .rules-card { padding:22px; background:var(--card); border:1px solid #ffffff18; border-radius:16px; }
  .rules-card h2 { font-size:18px; margin-bottom:12px; }
  .rules-card p { color:var(--muted); line-height:1.7; font-size:14px; }
  .submitted-answer { position:relative; padding:20px 65px 20px 20px; background:var(--card); border:2px solid var(--tier-c); border-radius:14px; }
  .submitted-answer p { margin-top:12px; overflow-wrap:anywhere; }
  .confirmation { color:var(--tier-c); font-size:12px; font-weight:800; }
  .edit-answer { position:absolute; top:14px; right:14px; background:var(--bg); border:1px solid #ffffff30; border-radius:10px; padding:10px; cursor:pointer; font-size:18px; }
  .theme-vote { margin-top:28px; }
  .current-answer { text-align:center; font-size:20px; padding:24px; margin:16px 0; }
  .like-button { border:1px solid #ffffff30; background:transparent; color:var(--text); padding:8px 12px; border-radius:999px; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .like-button.liked { background:#ec489922; border-color:#ec4899; }
  .like-button:disabled { opacity:.45; }
  .answer-reactions { margin-top:10px; }
  .answer-text { color:var(--muted); overflow-wrap:anywhere; }
  .review-row>div:first-child { min-width:0; overflow-wrap:anywhere; }
  .positive { color:var(--tier-c); } .negative { color:var(--tier-s); }
  .final-heading { text-align:center; padding:30px 0; }
  .final-heading h1 { font-size:4rem; margin:12px 0; }
  .final-heading p { color:var(--muted); }
  .stats-panel { background:var(--card); border:1px solid #ffffff18; border-radius:18px; padding:24px; margin:20px 0; }
  .stats-panel h2,.all-results h2 { font-size:20px; margin-bottom:22px; }
  .podium { display:flex; align-items:flex-end; gap:12px; text-align:center; }
  .podium-place { flex:1; min-width:0; }
  .podium-medal { display:block; font-size:30px; margin-bottom:10px; }
  .podium-place>strong { font-size:14px; }
  .podium-place p { font-size:12px; margin:10px 0; color:var(--muted); overflow-wrap:anywhere; }
  .podium-step { min-height:70px; background:#ffffff09; border:1px solid #ffffff18; border-radius:12px 12px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px 4px; }
  .rank-1 .podium-step { min-height:130px; border-color:var(--tier-b); background:#fdd83512; }
  .rank-2 .podium-step { min-height:100px; }
  .podium-step>strong { font-size:28px; }.podium-step>span { font-size:10px; color:var(--muted); }
  .stat-row { display:grid; grid-template-columns:minmax(100px,1fr) 2fr 45px; align-items:center; gap:14px; margin:18px 0; }
  .stat-name { font-size:14px; overflow-wrap:anywhere; }.stat-name small { display:block; color:var(--muted); margin-top:4px; }
  .stat-track { height:22px; position:relative; background:#ffffff09; border-radius:5px; }
  .zero-axis { position:absolute; left:50%; height:100%; width:1px; background:#ffffff80; }
  .stat-bar { position:absolute; top:3px; bottom:3px; border-radius:4px; }
  .positive-bar { background:var(--tier-c); }.negative-bar { background:var(--tier-s); }
  .popular-answer { display:flex; align-items:center; gap:14px; margin:16px 0; padding-bottom:16px; border-bottom:1px solid #ffffff12; }
  .popular-answer>div { flex:1; min-width:0; overflow-wrap:anywhere; }.popular-answer p { font-size:12px; color:var(--muted); margin-top:7px; }
  .popular-position { color:var(--tier-a); font-weight:900; }
  .all-results { margin:32px 0; }.all-results h3 { font-size:16px; margin:26px 0 14px; }.all-results h3 span { display:block; font-size:12px; color:var(--muted); margin-top:6px; }
  @media(max-width:600px) { .rules-grid { grid-template-columns:1fr; }.stats-panel { padding:16px; }.podium { gap:6px; }.podium-step>strong { font-size:24px; }.stat-row { grid-template-columns:minmax(90px,1fr) 1fr 32px; gap:8px; }.tier-badge { width:49px; height:52px; }.tier-badge small { font-size:7px; }.review-row { grid-template-columns:minmax(0,1fr) auto auto 24px; padding:10px; gap:7px; }.tier-options { gap:4px; }.tier-btn { padding:18px 3px; }.tier-btn small { font-size:8px; } }

  .theme-options { display:grid; gap:14px; margin:24px 0; }
  .theme-option { text-align:left; white-space:normal; overflow-wrap:anywhere; margin:0; border:2px solid #ffffff26; background:var(--card); color:var(--text); }
  .theme-option[aria-pressed="true"] { border-color:var(--tier-a); background:linear-gradient(120deg,var(--card),#ff980022); }
  .theme-option small { display:block; color:var(--muted); margin-top:8px; }
  .secret-tier { display:flex; flex-direction:column; align-items:center; justify-content:center; width:104px; height:104px; margin:14px auto; border:2px solid #ffffff55; border-radius:16px; color:white; font:900 48px 'Nunito',sans-serif; background:linear-gradient(135deg,var(--tier-s),var(--tier-a),var(--tier-e),var(--tier-f)); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:pointer; }
  .secret-tier small { font-size:13px; }
  .secret-tier.revealed { background:var(--secret-color); }
  .secret-tier:focus-visible { outline:3px solid var(--tier-a); outline-offset:4px; }
  @media(max-width:600px) { #lobby > .kick { margin-top:28px; margin-bottom:12px; min-height:44px; } }
</style>
</head>
<body>
<div class="leave-toolbar" id="leaveToolbar" hidden><button class="kick" id="btnLeave" onclick="leaveGame()">Sair da partida ↗</button></div>
<div id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden></div>

<!-- TELA 1: ENTRADA -->
<div id="entry" class="screen active">
  <h1>TIER DU</h1>
  <input id="inputName" type="text" placeholder="Seu nome" maxlength="20" />
  <div class="entry-options">
    <section><p>Crie uma nova partida com os amigos</p><button class="btn btn-primary" id="btnCreate">Criar sala</button></section>
    <section><p>Entre em uma sala existente</p><input id="inputCode" aria-label="Código da sala" placeholder="Código" maxlength="4" style="text-transform:uppercase"><button class="btn btn-primary" id="btnJoin">Entrar</button></section>
  </div>
  <p>Escolha a cor do jogo</p><div class="palette" id="palette"></div>
</div>

<!-- TELA 2: LOBBY -->
<div id="lobby" class="screen">
  <div class="room-code-box">
    <small>Código da sala</small>
    <div class="code" id="displayCode">----</div>
  </div>
  <div class="players-list" id="playersList"></div>
  <button class="btn btn-primary btn-start" id="btnStart" disabled>Iniciar partida (3+ jogadores)</button>
  <button class="kick" onclick="leaveGame()">Sair da partida</button>
  <div class="copy-link" id="copyLink">Copiar link da sala</div>
</div>

<!-- TELA 3: GAME -->
<div id="game" class="screen">
  <div id="gameContent"></div>
</div>

<script>
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
const TIERS=['S','A','B','C','E','F'];
const LABELS={S:'Lendários',A:'Excelentes',B:'Bons',C:'Mais ou menos',E:'Ruim',F:'Desastrosos'};
const NOTES={S:'10',A:'9 e 8',B:'7 e 6,5',C:'6,5 e 5',E:'4, 3 e 2',F:'1 e 0'};
let ws, myState={}, timerInterval, draftKey='', draft='';
const TIER_NOTES={S:'10',A:'9 e 8',B:'7 e 6,5',C:'6,5 e 5',E:'4, 3 e 2',F:'1 e 0'};
const SESSION_KEY='tier-du-session-v1';
let session=null, reconnectTimer, reconnectAttempt=0, heartbeatInterval, lastMessageAt=0, awaitingState=false;
function readSession() {
 try { const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||'null'); return s?.token&&s?.code?s:null; } catch {return null;}
}
function saveSession() {
 if(!session) return;
 session.snapshot=myState.phase?myState:session.snapshot;
 session.draftKey=draftKey; session.draft=draft;
 const value=JSON.stringify(session);
 try {sessionStorage.setItem(SESSION_KEY,value);} catch {}
 try {localStorage.setItem(SESSION_KEY,value);} catch {}
}
function clearSession() {
 session=null; clearTimeout(reconnectTimer); reconnectTimer=null; clearInterval(heartbeatInterval);
 try {sessionStorage.removeItem(SESSION_KEY);} catch {}
 try {localStorage.removeItem(SESSION_KEY);} catch {}
}
function connectionStatus(text='') {
 const el=document.getElementById('connectionStatus'); el.textContent=text; el.hidden=!text;
 document.querySelectorAll('#lobby button, #game button').forEach(button=>{
  if(text) {if(!button.hasAttribute('data-before-disconnect')) button.dataset.beforeDisconnect=String(button.disabled); button.disabled=true;}
  else if(button.hasAttribute('data-before-disconnect')) {button.disabled=button.dataset.beforeDisconnect==='true';delete button.dataset.beforeDisconnect;}
 });
}
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(type,data) { if(ws?.readyState===WebSocket.OPEN && (!awaitingState || type==='join' || type==='ping')) ws.send(JSON.stringify({type,data})); }
function showScreen(id) {
 document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
 document.getElementById('leaveToolbar').hidden=id==='entry'||['instructions','review'].includes(myState.phase);
}
function leaveGame() {
 const socket=ws;
 if(socket?.readyState===WebSocket.OPEN) socket.send(JSON.stringify({type:'leave'}));
 clearSession();ws=null;socket?.close();clearInterval(timerInterval);
 myState={};draft='';draftKey='';awaitingState=false;connectionStatus();showScreen('entry');
 // A shared invite remains useful, but must not auto-resume the departed seat.
}

function scheduleReconnect() {
 if(!session || reconnectTimer) return;
 connectionStatus('Reconectando à sala… Sua vaga e seu rascunho estão guardados.');
 const delay=Math.min(1000*2**Math.min(reconnectAttempt++,4),10000);
 reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect(session.name,session.code,session.token);},delay);
}
function connect(name,code,token='') {
 if(ws && [WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState)) return;
 const socket=new WebSocket(WS_URL); ws=socket; awaitingState=true;
 if(token) connectionStatus('Reconectando à sala… Sua vaga e seu rascunho estão guardados.');
 socket.onopen=()=>send('join',{name,code,token});
 socket.onmessage=ev=>{
  if(ws!==socket) return;
  lastMessageAt=Date.now();
  const d=JSON.parse(ev.data);
  if(d.type==='pong') return;
  if(d.type==='left') {leaveGame();return;}
  if(d.type==='sessionReplaced') {
   session=null; clearTimeout(reconnectTimer); reconnectTimer=null; clearInterval(heartbeatInterval);
   try {sessionStorage.removeItem(SESSION_KEY);} catch {}
   ws=null; socket.close(); showScreen('entry');
   connectionStatus('Sua sala foi aberta em outra aba. Continue jogando por lá.');
   return;
  }
  if(d.type==='joined') {
   myState={...myState,code:d.code,host:d.host,name:d.name||name};
   session={...session,code:d.code,name:d.name||name,token:d.token}; saveSession();
   document.getElementById('displayCode').textContent=d.code;
   return;
  }
  if(d.error) {
   const errors={sala_nao_encontrada:'Sala não encontrada.',nome_invalido:'Use um nome de até 20 caracteres.',nome_duplicado:'Esse nome já está em uso nesta sala. Escolha outro nome.',partida_em_andamento:'Esta partida já começou.',removido:'O host removeu você da sala.',sessao_expirada:'Esta sala não está mais disponível. Crie uma nova sala ou entre em outra.'};
   clearSession(); ws=null; socket.close(); connectionStatus(); showScreen('entry'); alert(errors[d.error]||d.error); return;
  }
  awaitingState=false; reconnectAttempt=0; clearTimeout(reconnectTimer); reconnectTimer=null;
  renderState(d);
  connectionStatus();
  clearInterval(heartbeatInterval);
  heartbeatInterval=setInterval(()=>{
   if(Date.now()-lastMessageAt>45000) {socket.close();return;}
   send('ping');
  },15000);
 };
 socket.onclose=()=>{
  if(ws!==socket) return;
  clearInterval(heartbeatInterval); saveSession();
  if(session) scheduleReconnect();
  else {awaitingState=false;connectionStatus('Não foi possível conectar. Tente criar ou entrar na sala novamente.');showScreen('entry');}
 };
 socket.onerror=()=>socket.close();
}

 if(focused) {const next=document.getElementById('answerText'); if(next) {next.focus(); next.setSelectionRange(...selection);} }
}

  <section class="rules-card"><h2>⚡ Um poder por tema</h2><p>Depois da discussão, você pode subir ou descer uma posição se achar que o consenso ficou errado. Use para corrigir a decisão e ajudar o time. Você tem 15 segundos para decidir. O poder pode ser usado uma única vez por tema e nunca na própria resposta; depois de usá-lo, você aguarda automaticamente os demais. Você pode passar a vez e guardá-lo. Poderes opostos se anulam e as letras respeitam os limites S e F.</p></section>

function bindSecretTier(tier) {
 const button=document.getElementById('secretTier');
 const hide=()=>{button.classList.remove('revealed');button.style.removeProperty('--secret-color');button.textContent='?';button.setAttribute('aria-label','Pressione e segure para ver sua nota secreta');};
 const reveal=()=>{if(!TIERS.includes(tier))return;button.classList.add('revealed');button.style.setProperty('--secret-color',`var(--tier-${tier.toLowerCase()})`);button.innerHTML=`<span>${esc(tier)}</span><small>${esc(TIER_NOTES[tier])}</small>`;button.setAttribute('aria-label',`Nota secreta ${tier}`);};
 button.onpointerdown=event=>{if(event.button!==0)return;event.preventDefault();button.setPointerCapture(event.pointerId);reveal();};
 for(const event of ['pointerup','pointercancel','pointerleave','lostpointercapture','blur'])button.addEventListener(event,hide);
 button.onkeydown=event=>{if(event.key===' '||event.key==='Enter'){event.preventDefault();reveal();}};
 button.onkeyup=event=>{if(event.key===' '||event.key==='Enter')hide();};
 button.oncontextmenu=event=>event.preventDefault();
 hide();
}

function statsChart(title,items,metric,emptyText) {

}
function roundPodium(results) {

}

 ${roundPodium(results)}
 ${statsChart('🎯 Mestres das respostas',stats,'score','Ainda não há respostas pontuadas.')}
 ${statsChart('🧠 Gênios das alterações',stats,'powerScore','Nenhum poder foi utilizado.')}
 <section class="stats-panel"><h2>❤️ As 5 respostas mais curtidas</h2>${popular.length?popular.map((a,i)=>`<div class="popular-answer"><span class="popular-position">${i+1}º</span><div><strong>${esc(a.text)}</strong><p>${esc(a.playerName)} · ${esc(a.theme)}</p></div>${likeButton(a,a.round)}</div>`).join(''):'<p class="people">Ainda não há curtidas. Escolha suas favoritas nas respostas abaixo!</p>'}</section>
 <section class="all-results"><h2>📝 Todas as respostas</h2>${results.map((r,i)=>`<h3>Rodada ${i+1} · ${esc(r.theme)} <span>${signed(r.score)} pontos</span></h3>${resultRows(r,i+1)}`).join('')}</section>
 ${d.host?'<button class="btn btn-secondary" id="btnRestart" onclick="send(\'restart\')">Jogar de novo na mesma sala</button>':'<p class="people" role="status">Vocês continuam na mesma sala. Aguardando o host iniciar uma nova partida.</p>'}`;
}

function startTimer(end) {clearInterval(timerInterval); const tick=()=>{const el=document.getElementById('timer'); const seconds=Math.max(0,Math.ceil((end-Date.now())/1000)); if(el) el.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}; tick(); timerInterval=setInterval(tick,250);}
const code=new URLSearchParams(location.search).get('code'); if(code) document.getElementById('inputCode').value=code;
function resumeOnReturn() {
 saveSession();
 if(!session || document.visibilityState==='hidden') return;
 clearTimeout(reconnectTimer); reconnectTimer=null;
 if(ws?.readyState===WebSocket.OPEN && Date.now()-lastMessageAt<=45000) {send('ping');return;}
 const old=ws; ws=null; old?.close();
 connect(session.name,session.code,session.token);
}
document.addEventListener('visibilitychange',resumeOnReturn);
window.addEventListener('online',resumeOnReturn);
window.addEventListener('pageshow',event=>{if(event.persisted) resumeOnReturn();});
window.addEventListener('pagehide',saveSession);
session=readSession();
if(session && (!code || code.toUpperCase()===session.code)) {
 draftKey=session.draftKey||'';draft=session.draft||'';
 if(session.snapshot?.phase) {myState=session.snapshot;renderState(myState);document.getElementById('displayCode').textContent=session.code;}
 connect(session.name,session.code,session.token);
} else if(session && code) {clearSession();}

</script>
</body>
</html>
