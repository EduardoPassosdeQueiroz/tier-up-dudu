name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes, vet e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Baixar e verificar dependências
        run: |
          go mod download
          go mod verify

      - name: Executar testes
        run: go test ./...

      - name: Verificação estática (go vet)
        run: go vet ./...

      - name: Compilar o projeto
        run: go build -o /tmp/tierup-ci .